packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  esbuild: true
  node-datachannel: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  react-dom: 19.3.0
  react-native-web: ~0.21.4
  tailwindcss: 3.4.18

patchedDependencies:
  react-native-chart-kit@7.0.4: patches/react-native-chart-kit@7.0.4.patch
  react-native-macos@0.83.0: patches/react-native-macos@0.83.0.patch
  react-native-mmkv@4.3.1: patches/react-native-mmkv@4.3.1.patch
  react-native-nitro-modules@0.35.4: patches/react-native-nitro-modules@0.35.4.patch
  # React Native macOS 0.83 codegen requires direct imports instead of CodegenTypes.*.
  react-native-svg@15.16.0: patches/react-native-svg@15.16.0.patch

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
