packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  screenatlas@git+https://github.com/TomasSestak/screenatlas.git#d22d688d207c9d8faa0468ae9f0ff85152b655f7: true
  esbuild: true
  node-datachannel: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  react-dom: 19.2.3
  react-native-web: 0.21.2
  tailwindcss: 3.4.18

patchedDependencies:
  expo-router: patches/expo-router.patch
  react-native-chart-kit@7.0.4: patches/react-native-chart-kit@7.0.4.patch
  react-native-macos: patches/react-native-macos.patch
  react-native-mmkv@4.3.1: patches/react-native-mmkv@4.3.1.patch

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
