packages:
  - apps/*
  - packages/*

nodeLinker: hoisted

allowBuilds:
  esbuild: true
  node-datachannel: true
  node-pty: true
  sharp: true
  unrs-resolver: true
  workerd: true

overrides:
  react-dom: 19.2.3
  react-native-web: 0.21.2
  tailwindcss: 3.4.18

patchedDependencies:
  expo-router: patches/expo-router.patch
  react-native-macos: patches/react-native-macos.patch
  react-native-mmkv@4.3.1: patches/react-native-mmkv@4.3.1.patch
