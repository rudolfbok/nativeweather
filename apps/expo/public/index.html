<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<!-- On nativeweather.app the site Worker (apps/worker) rewrites the title and description of city pages, adds
		     canonical + social tags, and adds Umami to every page. Neither belongs here: this file is the shell of every
		     route, and Tauri and the dev server serve it as is. -->
		<title>NativeWeather</title>
		<meta
			name="description"
			content="Explore current weather and forecasts for cities around the world with NativeWeather."
		/>
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
		<link rel="preconnect" href="https://tiles.openfreemap.org" />
		<link rel="preconnect" href="https://weathermaps.weatherapi.com" />
		<!-- The react-native-web root reset: full-height html, body and #root, scrolling left to the app's ScrollViews. -->
		<style id="expo-reset">
			html,
			body {
				height: 100%;
			}
			/* The theme token, so the area behind the app (Safari's overscroll, short pages) matches the screens. The
			   fallbacks are the same colours for the moment before the bundled stylesheet defines the variable. */
			html {
				background-color: var(--color-screen-background, #f2f2f7);
			}
			@media (prefers-color-scheme: dark) {
				html {
					background-color: var(--color-screen-background, #000000);
				}
			}
			body {
				overflow: hidden;
			}
			#root {
				display: flex;
				height: 100%;
				flex: 1;
			}
			/* Below md the document itself scrolls, so iOS Safari can collapse its toolbar (it ignores inner scrollers).
			   Stack screens are absolutely positioned and the scroll view is a fixed-height scroller, so every ancestor of a
			   page scroll view (marked by ScreenWrapper) is switched back to normal flow and the scroller stops scrolling. */
			@media (max-width: 767px) {
				html,
				body {
					height: auto;
					min-height: 100%;
				}
				body {
					overflow: visible;
				}
				#root {
					height: auto;
					min-height: 100vh;
					min-height: 100dvh;
				}
				#root div:has([data-page-scroll]) {
					position: relative !important;
					height: auto !important;
					overflow: visible !important;
				}
				[data-page-scroll] {
					flex: none !important;
					height: auto !important;
					overflow: visible !important;
				}
			}
		</style>
	</head>

	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
